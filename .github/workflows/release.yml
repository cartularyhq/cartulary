# SPDX-License-Identifier: Cartulary-Sustainable-Use-1.0
#
# Release: the gate and publisher for a tagged version.
#
# Purpose
#   Repeat every blocking check against the exact tagged commit, confirm that the tag, the
#   declared version, the changelog, the shipped documentation, and the evaluation evidence
#   all describe the same release, then build verified Linux, macOS, and Windows packages
#   with their checksums and rebuild the container image.
#
# Why the checks are repeated rather than trusted from the merge gate
#   The merge gate ran on a pull request's merge preview, not on the tagged commit. A tag
#   can point anywhere. Everything that must be true of the released bytes is therefore
#   re-established here from the tag itself.
#
# Trigger
#   A maintainer manually names an existing semantic tag to validate and publish.
#
# Inputs
#   tag (manual runs only) — an existing tag to check out, validate, and publish. No secrets.
#
# Outputs
#   A GitHub Release holding Linux x86_64, macOS Apple Silicon, macOS Intel, and Windows
#   x86_64 packages, their SHA-256 files, and the evaluation report; plus the tagged
#   production container in this repository's GHCR package.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic release tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Normalize every manual retry by its target tag so it cannot publish the same version concurrently.
  group: release-${{ format('refs/tags/{0}', inputs.tag) }}
  cancel-in-progress: false

jobs:
  # Establish every release guardrail once on Linux, verify and retain that package, and
  # publish the container. The macOS builds wait for this job so scarce runner time is not
  # spent on a tag that fails metadata, evaluation, parity, or security checks.
  linux:
    name: Validate and build Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: pgvector/pgvector:pg18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIX_ENV: test
      CARTULARY_DATABASE_MODE: external
      # Own database name so this workflow cannot collide with a concurrent lane. The
      # embedded historical tag is only part of the name and means nothing here.
      CARTULARY_TEST_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/cartulary_f11_release
    steps:
      # Explicit ref: without it, a manual run checks out the default branch and certifies a
      # commit that is not the one being released.
      - uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
      # Versioned assets and container tags are immutable release identities. Refuse an
      # already-published tag instead of silently replacing bytes under an existing name.
      - name: Refuse an already-published tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; release assets are immutable." >&2
            exit 1
          fi
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # No dependency cache anywhere in this workflow. A release is built from a clean
      # fetch so nothing carried over from an earlier run can end up in a shipped artifact.
      - run: mix deps.get
      # The same blocking checks the merge gate runs, in the same order, now against the
      # tagged commit. Type analysis is inline here rather than in a parallel job, since
      # there is no cached lookup table to justify separating it.
      - run: mix ash.codegen --check
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix sobelow --config
      - run: mix hex.audit
      # Deterministic evaluation, no models and no network, asserting the committed
      # correctness and citation floors. The report it writes is both an input to the next
      # step and a shipped artifact, so the published numbers are the ones actually gated.
      - run: >-
          mix cartulary.eval.release
          --no-model
          --assert-thresholds
          --run-id release-${{ github.run_id }}-${{ github.run_attempt }}
          --output /tmp/cartulary-f11-release.json
      # The release-specific check, and the one thing the merge gate cannot do: with the
      # tag supplied, it requires the tag to be exactly `v` followed by the version
      # declared in the project file, a dated changelog entry for that same version, the
      # release documentation to still describe this gate, and every report in the
      # evaluation evidence to name that same version. Stale evidence from a previous
      # version is rejected rather than accepted as good enough.
      - name: Validate tag, changelog, and eval guardrails
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          mix cartulary.release.check --tag "$tag" --eval-report /tmp/cartulary-f11-release.json
      # Dual purpose, and the ordering matters. This packages the release with the pinned,
      # checksum-verified embedded PostgreSQL, boots it from an empty data root, waits for
      # readiness, and reruns the whole suite against that self-started database — the
      # parity evidence. It also leaves the built release on disk, which is exactly what
      # the archive step below picks up. Shipping the artifact this lane just booted, and
      # not a separately built one, is what makes the verification meaningful.
      - name: Verify packaged pg0 lane and build platform release
        run: ./scripts/ci-pg0-lane
      - run: tar -C _build/prod/rel -czf /tmp/cartulary-linux-x86_64.tar.gz cartulary
      # The digest is published with the archive so a downloader can verify the bytes they
      # received are the bytes this run produced.
      - run: cd /tmp && shasum -a 256 cartulary-linux-x86_64.tar.gz > cartulary-linux-x86_64.tar.gz.sha256
      # Build once, then publish that exact local image under semantic-version and source-tag
      # names. Stable releases also advance `latest`; prereleases never do.
      - name: Build and publish production container
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision=$(git rev-parse HEAD)

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image:$version" \
            --tag "$image:$tag" \
            .
          docker push "$image:$version"
          docker push "$image:$tag"

          if [[ "$version" != *-* ]]; then
            docker tag "$image:$version" "$image:latest"
            docker push "$image:latest"
          fi
      # Keep a workflow-run copy for debugging and make the durable, versioned copies GitHub
      # Release assets in the final step below.
      - uses: actions/upload-artifact@v7
        with:
          name: cartulary-release-linux-x86_64-${{ github.run_id }}
          path: |
            /tmp/cartulary-linux-x86_64.tar.gz
            /tmp/cartulary-linux-x86_64.tar.gz.sha256
            /tmp/cartulary-f11-release.json
          retention-days: 90

  # A Mix release contains ERTS and native libraries, so one Mac archive cannot serve both
  # CPU families. Build and boot-test on the matching native GitHub runner instead of cross
  # compiling or asking Apple Silicon users to install Rosetta.
  macos:
    name: Build macOS ${{ matrix.asset_arch }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            machine_arch: arm64
            asset_arch: arm64
          - runner: macos-26-intel
            machine_arch: x86_64
            asset_arch: x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Confirm native runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine_arch }}"
      - run: mix deps.get
      # This builds the package, boots its embedded pg0 from an empty data root, waits for
      # readiness, and runs the full test suite against that database. The archive below is
      # made from the exact release that passed this platform check.
      - name: Verify packaged pg0 lane and build platform release
        run: ./scripts/ci-pg0-lane
      - name: Archive macOS release
        shell: bash
        run: |
          archive="cartulary-macos-${{ matrix.asset_arch }}.tar.gz"
          tar -C _build/prod/rel -czf "/tmp/$archive" cartulary
          cd /tmp
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: cartulary-release-macos-${{ matrix.asset_arch }}-${{ github.run_id }}
          path: |
            /tmp/cartulary-macos-${{ matrix.asset_arch }}.tar.gz
            /tmp/cartulary-macos-${{ matrix.asset_arch }}.tar.gz.sha256
          retention-days: 90

  # Windows packaging has its own PowerShell verification because the release
  # launcher and pg0 executable are native Windows binaries. It proves the same
  # cold-boot/readiness/full-suite contract as the Unix lanes before publishing.
  windows:
    name: Build Windows x86_64
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix deps.get
      - name: Verify packaged pg0 lane and build Windows release
        shell: pwsh
        run: .\scripts\ci-pg0-lane.ps1
      - name: Archive Windows release
        shell: pwsh
        run: |
          $archive = "cartulary-windows-x86_64.zip"
          $release = "_build\prod\rel\cartulary"
          Compress-Archive -Path $release -DestinationPath (Join-Path $env:TEMP $archive)
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $env:TEMP $archive)).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline (Join-Path $env:TEMP "$archive.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: cartulary-release-windows-x86_64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cartulary-windows-x86_64.zip
            ${{ runner.temp }}/cartulary-windows-x86_64.zip.sha256
          retention-days: 90

  # Fan in all platform outputs only after every package has booted and passed its checks.
  # `gh release create` uploads through a draft before publication, so the version appears
  # only when all archives, checksums, and evaluation evidence are attached.
  publish:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/cartulary-release
          pattern: cartulary-release-*-${{ github.run_id }}
          merge-multiple: true
      - name: Create GitHub Release and upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          assets=(
            /tmp/cartulary-release/cartulary-linux-x86_64.tar.gz
            /tmp/cartulary-release/cartulary-linux-x86_64.tar.gz.sha256
            /tmp/cartulary-release/cartulary-macos-arm64.tar.gz
            /tmp/cartulary-release/cartulary-macos-arm64.tar.gz.sha256
            /tmp/cartulary-release/cartulary-macos-x86_64.tar.gz
            /tmp/cartulary-release/cartulary-macos-x86_64.tar.gz.sha256
            /tmp/cartulary-release/cartulary-windows-x86_64.zip
            /tmp/cartulary-release/cartulary-windows-x86_64.zip.sha256
            /tmp/cartulary-release/cartulary-f11-release.json
          )
          release_args=(
            --verify-tag
            --generate-notes
            --title "$tag"
            --notes "Container image: \`$image\`"
          )

          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          gh release create "$tag" "${assets[@]}" "${release_args[@]}"
