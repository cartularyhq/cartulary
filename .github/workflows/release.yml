# SPDX-License-Identifier: Cartulary-Sustainable-Use-1.0
#
# Release: the gate and publisher for a tagged version.
#
# Purpose
#   Repeat every blocking check against the exact tagged commit, confirm that the tag, the
#   declared version, the changelog, the shipped documentation, and the evaluation evidence
#   all describe the same release, then build the Linux release archive with its checksum
#   and rebuild the container image.
#
# Why the checks are repeated rather than trusted from the merge gate
#   The merge gate ran on a pull request's merge preview, not on the tagged commit. A tag
#   can point anywhere. Everything that must be true of the released bytes is therefore
#   re-established here from the tag itself.
#
# Triggers
#   Pushing a tag shaped `v<major>.<minor>.<patch>`, or a manual run naming an existing tag
#   to validate and publish.
#
# Inputs
#   tag (manual runs only) — an existing tag to check out, validate, and publish. No secrets.
#
# Outputs
#   A GitHub Release holding the Linux release tarball, its SHA-256, and the evaluation
#   report; and the same tagged production build in this repository's GHCR package.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic release tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # One job rather than the parallel lanes used for merges. A release is infrequent and
  # sequential clarity is worth more here than elapsed time: the first failure stops the
  # release outright.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    services:
      postgres:
        image: pgvector/pgvector:pg18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIX_ENV: test
      CARTULARY_DATABASE_MODE: external
      # Own database name so this workflow cannot collide with a concurrent lane. The
      # embedded historical tag is only part of the name and means nothing here.
      CARTULARY_TEST_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/cartulary_f11_release
    steps:
      # Explicit ref: a manual run validates the tag it was given, a tag push validates
      # itself. Without this a manual run would check out the default branch and certify a
      # commit that is not the one being released.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      # Versioned assets and container tags are immutable release identities. Refuse an
      # already-published tag instead of silently replacing bytes under an existing name.
      - name: Refuse an already-published tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; release assets are immutable." >&2
            exit 1
          fi
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # No dependency cache anywhere in this workflow. A release is built from a clean
      # fetch so nothing carried over from an earlier run can end up in a shipped artifact.
      - run: mix deps.get
      # The same blocking checks the merge gate runs, in the same order, now against the
      # tagged commit. Type analysis is inline here rather than in a parallel job, since
      # there is no cached lookup table to justify separating it.
      - run: mix ash.codegen --check
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix sobelow --config
      - run: mix hex.audit
      # Deterministic evaluation, no models and no network, asserting the committed
      # correctness and citation floors. The report it writes is both an input to the next
      # step and a shipped artifact, so the published numbers are the ones actually gated.
      - run: >-
          mix cartulary.eval.release
          --no-model
          --assert-thresholds
          --run-id release-${{ github.run_id }}-${{ github.run_attempt }}
          --output /tmp/cartulary-f11-release.json
      # The release-specific check, and the one thing the merge gate cannot do: with the
      # tag supplied, it requires the tag to be exactly `v` followed by the version
      # declared in the project file, a dated changelog entry for that same version, the
      # release documentation to still describe this gate, and every report in the
      # evaluation evidence to name that same version. Stale evidence from a previous
      # version is rejected rather than accepted as good enough.
      - name: Validate tag, changelog, and eval guardrails
        shell: bash
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          mix cartulary.release.check --tag "$tag" --eval-report /tmp/cartulary-f11-release.json
      # Dual purpose, and the ordering matters. This packages the release with the pinned,
      # checksum-verified embedded PostgreSQL, boots it from an empty data root, waits for
      # readiness, and reruns the whole suite against that self-started database — the
      # parity evidence. It also leaves the built release on disk, which is exactly what
      # the archive step below picks up. Shipping the artifact this lane just booted, and
      # not a separately built one, is what makes the verification meaningful.
      - name: Verify packaged pg0 lane and build platform release
        run: ./scripts/ci-pg0-lane
      - run: tar -C _build/prod/rel -czf /tmp/cartulary-linux-x86_64.tar.gz cartulary
      # The digest is published with the archive so a downloader can verify the bytes they
      # received are the bytes this run produced.
      - run: cd /tmp && shasum -a 256 cartulary-linux-x86_64.tar.gz > cartulary-linux-x86_64.tar.gz.sha256
      # Build once, then publish that exact local image under semantic-version and source-tag
      # names. Stable releases also advance `latest`; prereleases never do.
      - name: Build and publish production container
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision=$(git rev-parse HEAD)

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image:$version" \
            --tag "$image:$tag" \
            .
          docker push "$image:$version"
          docker push "$image:$tag"

          if [[ "$version" != *-* ]]; then
            docker tag "$image:$version" "$image:latest"
            docker push "$image:latest"
          fi
      # Keep a workflow-run copy for debugging and make the durable, versioned copies GitHub
      # Release assets in the final step below.
      - uses: actions/upload-artifact@v7
        with:
          name: cartulary-release-${{ github.run_id }}
          path: |
            /tmp/cartulary-linux-x86_64.tar.gz
            /tmp/cartulary-linux-x86_64.tar.gz.sha256
            /tmp/cartulary-f11-release.json
          retention-days: 90
      # Publishing is last: a failed validation, parity run, archive, checksum, or container
      # push cannot create a release that looks complete. `gh release create` uploads through
      # a draft before publication, so the version appears only with all three assets.
      - name: Create GitHub Release and upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          assets=(
            /tmp/cartulary-linux-x86_64.tar.gz
            /tmp/cartulary-linux-x86_64.tar.gz.sha256
            /tmp/cartulary-f11-release.json
          )
          release_args=(
            --verify-tag
            --generate-notes
            --title "$tag"
            --notes "Container image: \`$image\`"
          )

          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          gh release create "$tag" "${assets[@]}" "${release_args[@]}"
