# SPDX-License-Identifier: Cartulary-Sustainable-Use-1.0
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  external-postgres:
    name: Deterministic gate (external Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CARTULARY_DATABASE_MODE: external
      CARTULARY_TEST_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/cartulary_f11_external
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-test-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix ash.codegen --check
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict
      - run: mix sobelow --config
      - run: mix hex.audit
      - name: Deterministic release evaluation
        run: >-
          mix cartulary.eval.release
          --no-model
          --assert-thresholds
          --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          --output /tmp/cartulary-f11-eval.json
      - run: mix cartulary.eval.verify /tmp/cartulary-f11-eval.json
      - run: >-
          mix cartulary.release.check
          --eval-report /tmp/cartulary-f11-eval.json
      - uses: actions/upload-artifact@v7
        with:
          name: deterministic-eval-${{ github.run_id }}
          path: /tmp/cartulary-f11-eval.json

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer

  pg0:
    name: Deterministic gate (packaged pg0)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-pg0-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: ./scripts/ci-pg0-lane

  builds:
    name: Release and container builds
    needs: [external-postgres, dialyzer, pg0]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-prod-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --only prod
      - run: mix release --overwrite
      - run: docker build --tag cartulary:ci .
